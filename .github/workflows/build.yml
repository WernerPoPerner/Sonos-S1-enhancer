name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core)
        run: ./gradlew :core:test --no-daemon

      - name: Decode signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/s1player.keystore"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/s1player.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 fehlt – APK wird mit wechselndem Debug-Schlüssel signiert."
          fi

      - name: Build APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: S1-Player-apk
          path: app/build/outputs/apk/release/*.apk
